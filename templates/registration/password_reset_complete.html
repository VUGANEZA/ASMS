{% extends 'base.html' %}
{% block title %}Password Reset Complete — ASMS{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5 mb-5">
    <div class="col-md-5">
        <div class="card p-4 shadow-sm border-0 text-center">
            <div class="mb-3">
                <i class="fa-solid fa-circle-check" style="font-size: 3rem; color: #198754;"></i>
            </div>
            <h3 class="mb-3" style="color: #1b5e5a; font-weight: 700;">Password Reset Successful</h3>
            <p class="text-muted">Your password has been successfully set. You may now go ahead and log in with your new password.</p>
            
            <a href="{% url 'login' %}" class="btn text-white mt-3 px-4 fw-bold" style="background-color: #1b5e5a;">Log In</a>
        </div>
    </div>
</div>
{% endblock %}
