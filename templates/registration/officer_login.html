{% extends 'base.html' %}
{% block title %}{{ t.admin_login }}{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4 border-warning" style="border-top: 5px solid #ffc107;">
            <h3 class="text-center mb-4">{{ t.admin_login }}</h3>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">{{ t.username }}</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">{{ t.password }}</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-asms w-100">{{ t.login }}</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'home' %}?lang={{ current_lang }}" class="text-muted">← {{ t.home }}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
