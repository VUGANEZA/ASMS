{% extends 'base.html' %}
{% block title %}Reset Password — ASMS{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5 mb-5">
    <div class="col-md-5">
        <div class="card p-4 shadow-sm border-0">
            <h3 class="text-center mb-3" style="color: #1b5e5a; font-weight: 700;">Reset Your Password</h3>
            <p class="text-muted text-center mb-4">Enter your email address below, and we'll email you a link to reset your password.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Email Address</label>
                    <input type="email" name="email" class="form-control" required placeholder="name@example.com">
                </div>
                <button type="submit" class="btn w-100 text-white fw-bold" style="background-color: #1b5e5a;">Send Reset Link</button>
            </form>
            
            <div class="text-center mt-3">
                <a href="{% url 'login' %}" class="text-decoration-none small text-muted">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
